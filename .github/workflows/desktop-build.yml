name: Desktop packages

on:
  push:
    branches: [main]
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: npm run build:linux
            artifact: linux
          - os: windows-latest
            command: npm run build:windows
            artifact: windows
          - os: macos-latest
            command: npm run build:macos
            artifact: macos
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: lasercut-studio-${{ matrix.artifact }}-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
